<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="StreamLauncher"/>
  <meta name="theme-color" content="#0b0d14"/>
  <link rel="manifest" href="manifest.json"/>
  <title>StreamLauncher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg:      #0b0d14;
      --surface: #131520;
      --surface2:#1a1d2e;
      --border:  rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --a:       #f59e0b;
      --a2:      #fbbf24;
      --b:       #f43f5e;
      --text:    #f0f0fa;
      --text2:   #9090b0;
      --muted:   #4a4a68;
      --ease:    cubic-bezier(0.16,1,0.3,1);
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Outfit', sans-serif;
      overscroll-behavior: none;
    }

    /* ── FOND AMBIANT ── */
    #ambient {
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%,  rgba(245,158,11,0.07) 0%,transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 30%, rgba(244,63,94,0.05)  0%,transparent 55%),
        radial-gradient(ellipse 70% 80% at 50% 110%,rgba(59,130,246,0.06) 0%,transparent 60%);
    }

    /* ════════════════════════════
       ÉCRAN PROFILS
    ════════════════════════════ */
    #screen-profiles {
      position:fixed; inset:0; z-index:100;
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; padding:24px;
      background:var(--bg);
      padding-top: calc(var(--safe-top) + 24px);
      padding-bottom: calc(var(--safe-bottom) + 24px);
      transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
    }
    #screen-profiles.hidden {
      opacity:0; transform:scale(1.04) translateY(-20px);
      pointer-events:none;
    }

    .logo-row {
      display:flex; align-items:center; gap:12px;
      margin-bottom:48px;
      animation: fadeDown 0.6s var(--ease) both;
    }
    @keyframes fadeDown {
      from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)}
    }
    .logo-icon {
      width:48px; height:48px; border-radius:14px;
      background:linear-gradient(135deg,var(--a),var(--b));
      display:flex; align-items:center; justify-content:center;
      font-size:24px;
      box-shadow:0 0 28px rgba(245,158,11,0.35);
    }
    .logo-text {
      font-size:24px; font-weight:800; letter-spacing:-0.8px;
    }
    .logo-text em { font-style:normal; color:var(--a2); }

    .profiles-title {
      font-size:22px; font-weight:700; letter-spacing:-0.5px;
      margin-bottom:6px; text-align:center;
      animation:fadeUp 0.5s var(--ease) 0.1s both;
    }
    .profiles-sub {
      font-size:14px; color:var(--text2); margin-bottom:40px;
      text-align:center;
      animation:fadeUp 0.5s var(--ease) 0.15s both;
    }
    @keyframes fadeUp {
      from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)}
    }

    .profiles-grid {
      display:flex; flex-wrap:wrap; justify-content:center;
      gap:18px; width:100%; max-width:380px;
      animation:fadeUp 0.5s var(--ease) 0.2s both;
    }

    .profile-card {
      display:flex; flex-direction:column; align-items:center; gap:10px;
      cursor:pointer; -webkit-tap-highlight-color:transparent;
      transition:transform 0.2s var(--ease);
      flex: 0 0 calc(33% - 12px);
    }
    .profile-card:active { transform:scale(0.93); }

    .pc-av {
      width:76px; height:76px; border-radius:20px;
      background:linear-gradient(135deg,#1a1d2e,#252840);
      display:flex; align-items:center; justify-content:center;
      font-size:34px; border:2px solid var(--border);
      transition:all 0.25s var(--ease);
      position:relative;
    }
    .profile-card:active .pc-av {
      box-shadow:0 0 0 3px var(--a);
    }
    .pc-name {
      font-size:12px; font-weight:600; color:var(--text2);
      text-align:center; letter-spacing:0.2px;
    }
    .profile-card.add-card .pc-av {
      background:transparent; border:2px dashed var(--muted);
      color:var(--muted); font-size:24px; font-weight:300;
    }

    /* Bouton gérer */
    .btn-manage {
      margin-top:32px; padding:9px 22px; border-radius:10px;
      border:1px solid var(--border); background:none;
      color:var(--muted); font-size:13px; font-weight:600;
      font-family:'Outfit',sans-serif; cursor:pointer;
      animation:fadeUp 0.5s var(--ease) 0.3s both;
      transition:all 0.2s;
    }
    .btn-manage:active { background:var(--surface); }

    /* Bouton X sur les cartes en mode manage */
    .del-btn {
      position:absolute; top:-6px; right:-6px;
      width:22px; height:22px; border-radius:50%;
      background:var(--b); border:2px solid var(--bg);
      color:white; font-size:11px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      animation:popIn 0.2s var(--ease);
    }
    @keyframes popIn { from{transform:scale(0)} to{transform:scale(1)} }

    /* ── ÉCRAN CRÉER PROFIL ── */
    #screen-create {
      position:fixed; inset:0; z-index:110;
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; padding:24px;
      padding-top: calc(var(--safe-top) + 24px);
      padding-bottom: calc(var(--safe-bottom) + 24px);
      background:var(--bg);
      opacity:0; transform:translateY(30px); pointer-events:none;
      transition:opacity 0.35s var(--ease), transform 0.35s var(--ease);
    }
    #screen-create.visible {
      opacity:1; transform:translateY(0); pointer-events:auto;
    }

    .create-title { font-size:22px; font-weight:700; margin-bottom:6px; text-align:center; }
    .create-sub   { font-size:14px; color:var(--text2); margin-bottom:32px; text-align:center; }

    .av-grid {
      display:flex; flex-wrap:wrap; gap:10px;
      justify-content:center; margin-bottom:24px; max-width:340px;
    }
    .av-opt {
      width:52px; height:52px; border-radius:14px;
      border:2px solid var(--border); background:var(--surface);
      cursor:pointer; font-size:24px;
      display:flex; align-items:center; justify-content:center;
      transition:all 0.15s; -webkit-tap-highlight-color:transparent;
    }
    .av-opt:active { transform:scale(0.9); }
    .av-opt.sel {
      border-color:var(--a);
      background:rgba(245,158,11,0.12);
      box-shadow:0 0 0 1px var(--a);
    }

    .name-input {
      width:100%; max-width:320px; padding:14px 16px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:14px; color:var(--text); font-size:16px;
      font-family:'Outfit',sans-serif; outline:none;
      transition:border-color 0.2s; margin-bottom:14px;
      -webkit-appearance:none;
    }
    .name-input:focus { border-color:var(--a); }
    .name-input::placeholder { color:var(--muted); }

    .btn-row { display:flex; gap:10px; width:100%; max-width:320px; }
    .btn-back {
      flex:1; padding:14px; border-radius:14px;
      border:1px solid var(--border); background:none;
      color:var(--text2); font-size:14px; font-weight:600;
      font-family:'Outfit',sans-serif; cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      transition:background 0.15s;
    }
    .btn-back:active { background:var(--surface); }
    .btn-confirm {
      flex:2; padding:14px; border-radius:14px;
      background:linear-gradient(135deg,var(--a),var(--b));
      border:none; color:white; font-size:15px; font-weight:700;
      font-family:'Outfit',sans-serif; cursor:pointer;
      box-shadow:0 4px 20px rgba(245,158,11,0.3);
      -webkit-tap-highlight-color:transparent;
      transition:transform 0.15s, box-shadow 0.15s;
    }
    .btn-confirm:active { transform:scale(0.97); box-shadow:0 2px 10px rgba(245,158,11,0.2); }

    /* ── CHARGEMENT PROFIL ── */
    #screen-loading {
      position:fixed; inset:0; z-index:120;
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:20px;
      background:var(--bg);
      opacity:0; pointer-events:none;
      transition:opacity 0.3s;
    }
    #screen-loading.visible { opacity:1; pointer-events:auto; }
    .load-av {
      width:96px; height:96px; border-radius:24px;
      background:linear-gradient(135deg,var(--a),var(--b));
      display:flex; align-items:center; justify-content:center;
      font-size:48px;
      box-shadow:0 0 48px rgba(245,158,11,0.4);
      animation:bigIn 0.5s var(--ease);
    }
    @keyframes bigIn { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }
    .load-name { font-size:20px; font-weight:700; letter-spacing:-0.5px; }
    .load-bar { width:140px; height:3px; background:var(--surface2); border-radius:99px; overflow:hidden; }
    .load-fill {
      height:100%; width:0%;
      background:linear-gradient(to right,var(--a),var(--a2));
      border-radius:99px;
      box-shadow:0 0 8px rgba(245,158,11,0.8);
      transition:width 0.7s var(--ease);
    }

    /* ════════════════════════════
       APP PRINCIPALE
    ════════════════════════════ */
    #app {
      position:fixed; inset:0; z-index:50;
      display:flex; flex-direction:column;
      opacity:0; pointer-events:none;
      transition:opacity 0.4s var(--ease);
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    #app.visible { opacity:1; pointer-events:auto; }

    /* ── TOPBAR ── */
    #topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px; flex-shrink:0;
      border-bottom:1px solid var(--border);
      background:rgba(11,13,20,0.8);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      position:relative; z-index:10;
    }
    .topbar-logo {
      font-size:18px; font-weight:800; letter-spacing:-0.5px;
      display:flex; align-items:center; gap:8px;
    }
    .topbar-logo span { font-size:20px; }
    .topbar-logo em { font-style:normal; color:var(--a2); }

    .topbar-right { display:flex; align-items:center; gap:8px; }

    .icon-btn {
      width:36px; height:36px; border-radius:10px;
      border:1px solid var(--border); background:none;
      color:var(--text2); cursor:pointer; font-size:16px;
      display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent;
      transition:all 0.15s; position:relative;
    }
    .icon-btn:active { background:var(--surface); transform:scale(0.93); }

    .avatar-mini {
      width:36px; height:36px; border-radius:10px;
      background:linear-gradient(135deg,var(--a),var(--b));
      display:flex; align-items:center; justify-content:center;
      font-size:17px; cursor:pointer; border:none;
      -webkit-tap-highlight-color:transparent;
      box-shadow:0 2px 10px rgba(245,158,11,0.2);
      transition:transform 0.15s;
    }
    .avatar-mini:active { transform:scale(0.9); }

    /* ── CONTENU PRINCIPAL ── */
    #main-content {
      flex:1; overflow:hidden; position:relative;
    }

    /* ── DASHBOARD ── */
    #dashboard {
      position:absolute; inset:0; overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding:24px 16px 100px;
    }
    .dash-header { margin-bottom:28px; }
    .dash-greeting {
      font-size:12px; font-weight:700; letter-spacing:2px;
      text-transform:uppercase; color:var(--a);
      margin-bottom:6px;
    }
    .dash-title {
      font-size:30px; font-weight:800; letter-spacing:-1.5px; line-height:1.05;
    }
    .dash-title em { font-style:normal; color:var(--a2); }
    .dash-sub { color:var(--text2); font-size:14px; margin-top:6px; }

    .section-label {
      font-size:11px; font-weight:700; letter-spacing:2px;
      text-transform:uppercase; color:var(--muted);
      margin-bottom:14px; margin-top:28px;
      display:flex; align-items:center; gap:10px;
    }
    .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

    .sites-grid {
      display:grid; grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .site-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:18px; padding:20px 16px;
      cursor:pointer; -webkit-tap-highlight-color:transparent;
      transition:all 0.2s var(--ease);
      position:relative; overflow:hidden;
      animation:cardIn 0.5s var(--ease) both;
    }
    @keyframes cardIn {
      from{opacity:0;transform:translateY(16px) scale(0.97)}
      to  {opacity:1;transform:translateY(0) scale(1)}
    }
    .site-card::after {
      content:''; position:absolute; top:0; right:0;
      width:70px; height:70px;
      background:radial-gradient(circle at top right,var(--card-c,var(--a)),transparent 65%);
      opacity:0.08; transition:opacity 0.2s;
    }
    .site-card:active {
      transform:scale(0.96);
      border-color:var(--card-c,var(--a));
      box-shadow:0 0 0 1px var(--card-c,var(--a));
    }
    .site-card:active::after { opacity:0.16; }
    .card-icon { font-size:30px; margin-bottom:10px; }
    .card-name { font-size:15px; font-weight:700; margin-bottom:3px; letter-spacing:-0.2px; }
    .card-desc { font-size:11px; color:var(--text2); }
    .card-tag {
      position:absolute; top:12px; right:12px;
      font-size:8px; font-weight:700; letter-spacing:1px;
      padding:2px 7px; border-radius:20px;
      background:rgba(255,255,255,0.05); color:var(--muted);
      border:1px solid var(--border);
    }

    /* ── WEBVIEW CONTAINER ── */
    #webview-container {
      position:absolute; inset:0;
      display:none; flex-direction:column;
    }
    #webview-container.active { display:flex; }

    .wv-topbar {
      display:flex; align-items:center; gap:10px;
      padding:10px 14px; background:rgba(11,13,20,0.9);
      backdrop-filter:blur(20px); flex-shrink:0;
      border-bottom:1px solid var(--border);
    }
    .wv-back {
      width:34px; height:34px; border-radius:9px;
      border:1px solid var(--border); background:none;
      color:var(--text); font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent;
      flex-shrink:0; transition:background 0.15s;
    }
    .wv-back:active { background:var(--surface); }
    .wv-site-name { font-size:14px; font-weight:600; flex:1; }
    .wv-reload {
      width:34px; height:34px; border-radius:9px;
      border:1px solid var(--border); background:none;
      color:var(--muted); font-size:16px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent; transition:all 0.15s;
    }
    .wv-reload:active { background:var(--surface); color:var(--text); }

    /* iFrame qui charge le site */
    #site-iframe {
      flex:1; border:none; width:100%; background:var(--bg);
    }

    .wv-loading {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:16px;
      background:var(--bg); z-index:5;
      pointer-events:none;
    }
    .wv-loading.hidden { display:none; }
    .ring {
      width:40px; height:40px; border-radius:50%;
      border:3px solid var(--surface2);
      border-top-color:var(--a);
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
    .wv-loading p { font-size:13px; color:var(--muted); }

    /* ── BARRE NAV BAS ── */
    #bottom-nav {
      position:fixed; bottom:0; left:0; right:0;
      padding-bottom:var(--safe-bottom);
      background:rgba(11,13,20,0.92);
      backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      border-top:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-around;
      z-index:200; height:calc(64px + var(--safe-bottom));
      align-items:flex-start; padding-top:10px;
    }
    .nav-btn {
      display:flex; flex-direction:column; align-items:center; gap:4px;
      cursor:pointer; padding:4px 10px;
      -webkit-tap-highlight-color:transparent;
      transition:transform 0.15s;
      border:none; background:none; color:var(--muted);
      font-family:'Outfit',sans-serif;
    }
    .nav-btn:active { transform:scale(0.88); }
    .nav-btn.active { color:var(--a); }
    .nav-icon { font-size:22px; line-height:1; }
    .nav-label { font-size:9px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; }

    /* ════════════════════════════
       PANNEAU THÈMES (bottom sheet)
    ════════════════════════════ */
    #theme-sheet {
      position:fixed; inset:0; z-index:800;
      display:flex; align-items:flex-end;
      pointer-events:none;
    }
    #theme-sheet.open { pointer-events:auto; }
    .sheet-backdrop {
      position:absolute; inset:0; background:rgba(0,0,0,0.6);
      opacity:0; transition:opacity 0.3s;
      backdrop-filter:blur(4px);
    }
    #theme-sheet.open .sheet-backdrop { opacity:1; }
    .sheet-content {
      position:relative; width:100%;
      background:var(--surface); border-radius:24px 24px 0 0;
      padding:0 20px calc(var(--safe-bottom) + 20px);
      transform:translateY(100%);
      transition:transform 0.4s var(--ease);
    }
    #theme-sheet.open .sheet-content { transform:translateY(0); }

    .sheet-handle {
      width:40px; height:4px; border-radius:2px;
      background:var(--border2); margin:12px auto 20px;
    }
    .sheet-title {
      font-size:16px; font-weight:700; margin-bottom:18px; letter-spacing:-0.3px;
    }

    .theme-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px; }
    .theme-opt {
      display:flex; align-items:center; gap:12px;
      padding:12px 14px; border-radius:14px;
      border:1px solid var(--border); background:none;
      color:var(--text); cursor:pointer; font-size:14px; font-weight:500;
      font-family:'Outfit',sans-serif;
      -webkit-tap-highlight-color:transparent;
      transition:all 0.15s;
    }
    .theme-opt:active { transform:scale(0.97); }
    .theme-opt.active { border-color:var(--a); background:rgba(245,158,11,0.08); }
    .theme-swatch {
      width:22px; height:22px; border-radius:7px; flex-shrink:0;
    }

    /* ════════════════════════════
       MODAL PROFILS (bottom sheet)
    ════════════════════════════ */
    #profile-sheet {
      position:fixed; inset:0; z-index:800;
      display:flex; align-items:flex-end;
      pointer-events:none;
    }
    #profile-sheet.open { pointer-events:auto; }
    #profile-sheet .sheet-backdrop {
      position:absolute; inset:0; background:rgba(0,0,0,0.6);
      opacity:0; transition:opacity 0.3s;
      backdrop-filter:blur(4px);
    }
    #profile-sheet.open .sheet-backdrop { opacity:1; }
    #profile-sheet .sheet-content {
      position:relative; width:100%;
      background:var(--surface); border-radius:24px 24px 0 0;
      padding:0 20px calc(var(--safe-bottom) + 20px);
      transform:translateY(100%);
      transition:transform 0.4s var(--ease);
      max-height:80vh; overflow-y:auto;
    }
    #profile-sheet.open .sheet-content { transform:translateY(0); }

    .profile-items { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
    .profile-row {
      display:flex; align-items:center; gap:14px;
      padding:12px 14px; border-radius:14px;
      border:1px solid var(--border); cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      transition:all 0.15s; background:none; color:var(--text);
      font-family:'Outfit',sans-serif; text-align:left; width:100%;
    }
    .profile-row:active { background:var(--surface2); }
    .profile-row.active-p { border-color:var(--a); background:rgba(245,158,11,0.06); }
    .pr-av {
      width:42px; height:42px; border-radius:12px;
      background:linear-gradient(135deg,var(--a),var(--b));
      display:flex; align-items:center; justify-content:center;
      font-size:20px; flex-shrink:0;
    }
    .pr-info { flex:1; }
    .pr-name { font-size:14px; font-weight:600; }
    .pr-date { font-size:11px; color:var(--muted); margin-top:1px; }
    .pr-badge {
      font-size:9px; font-weight:700; letter-spacing:1px;
      padding:2px 7px; border-radius:20px;
      background:rgba(245,158,11,0.15); color:var(--a);
      border:1px solid rgba(245,158,11,0.3);
    }
    .pr-del {
      width:28px; height:28px; border-radius:8px;
      border:1px solid var(--border); background:none;
      color:var(--muted); cursor:pointer; font-size:13px;
      display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent;
    }
    .pr-del:active { background:rgba(244,63,94,0.15); color:var(--b); }

    .sheet-new-title {
      font-size:12px; font-weight:700; letter-spacing:2px;
      text-transform:uppercase; color:var(--muted);
      margin-bottom:12px; border-top:1px solid var(--border); padding-top:16px;
    }

    ::-webkit-scrollbar { display:none; }
  </style>
</head>
<body>
<div id="ambient"></div>

<!-- ══ SÉLECTION PROFIL ══ -->
<div id="screen-profiles">
  <div class="logo-row">
    <div class="logo-icon">🎬</div>
    <div class="logo-text">Stream<em>Launcher</em></div>
  </div>
  <div class="profiles-title">Qui regarde ?</div>
  <div class="profiles-sub">Sélectionne ton profil</div>
  <div class="profiles-grid" id="profiles-grid"></div>
  <button class="btn-manage" id="btn-manage">Gérer les profils</button>
</div>

<!-- ══ CRÉER PROFIL ══ -->
<div id="screen-create">
  <div class="create-title">Nouveau profil</div>
  <div class="create-sub">Choisis un avatar et un nom</div>
  <div class="av-grid" id="av-grid"></div>
  <input class="name-input" id="new-name" type="text" placeholder="Ton prénom…" maxlength="20" autocomplete="off"/>
  <div class="btn-row">
    <button class="btn-back" id="btn-back">← Retour</button>
    <button class="btn-confirm" id="btn-confirm">Créer</button>
  </div>
</div>

<!-- ══ CHARGEMENT ══ -->
<div id="screen-loading">
  <div class="load-av" id="load-av">👤</div>
  <div class="load-name" id="load-name"></div>
  <div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
</div>

<!-- ══ APP PRINCIPALE ══ -->
<div id="app">
  <!-- TOPBAR -->
  <div id="topbar">
    <div class="topbar-logo"><span>🎬</span>Stream<em>Launcher</em></div>
    <div class="topbar-right">
      <button class="icon-btn" id="btn-theme-top" title="Thèmes">🎨</button>
      <button class="avatar-mini" id="btn-profile-top">👤</button>
    </div>
  </div>

  <!-- CONTENU -->
  <div id="main-content">
    <!-- Dashboard -->
    <div id="dashboard">
      <div class="dash-header">
        <div class="dash-greeting" id="greeting">Bienvenue</div>
        <h1 class="dash-title">Ton univers<br/><em>streaming</em></h1>
        <p class="dash-sub">Tous tes sites, en un tap.</p>
      </div>
      <div class="section-label">Sites disponibles</div>
      <div class="sites-grid" id="sites-grid"></div>
    </div>

    <!-- Webview container -->
    <div id="webview-container">
      <div class="wv-topbar">
        <button class="wv-back" id="wv-back">‹</button>
        <span class="wv-site-name" id="wv-site-name"></span>
        <button class="wv-reload" id="wv-reload">⟳</button>
      </div>
      <div class="wv-loading" id="wv-loading">
        <div class="ring"></div>
        <p id="wv-loading-text">Chargement…</p>
      </div>
      <iframe id="site-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation"></iframe>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div id="bottom-nav">
    <button class="nav-btn active" id="nav-home">
      <span class="nav-icon">⌂</span>
      <span class="nav-label">Accueil</span>
    </button>
    <button class="nav-btn" id="nav-sites">
      <span class="nav-icon">📺</span>
      <span class="nav-label">Sites</span>
    </button>
    <button class="nav-btn" id="nav-profile">
      <span class="nav-icon" id="nav-profile-icon">👤</span>
      <span class="nav-label">Profil</span>
    </button>
  </div>
</div>

<!-- ══ BOTTOM SHEET THÈMES ══ -->
<div id="theme-sheet">
  <div class="sheet-backdrop" id="theme-backdrop"></div>
  <div class="sheet-content">
    <div class="sheet-handle"></div>
    <div class="sheet-title">🎨 Thème d'accent</div>
    <div class="theme-grid" id="theme-grid"></div>
  </div>
</div>

<!-- ══ BOTTOM SHEET PROFILS ══ -->
<div id="profile-sheet">
  <div class="sheet-backdrop" id="profile-backdrop"></div>
  <div class="sheet-content">
    <div class="sheet-handle"></div>
    <div class="sheet-title">👤 Profils</div>
    <div class="profile-items" id="profile-items"></div>
    <div class="sheet-new-title">Nouveau profil</div>
    <div class="av-grid" id="sheet-av-grid"></div>
    <input class="name-input" id="sheet-new-name" type="text" placeholder="Ton prénom…" maxlength="20" autocomplete="off"/>
    <button class="btn-confirm" id="sheet-btn-confirm" style="width:100%;margin-top:4px">Créer le profil</button>
  </div>
</div>

<script>
// ════════════════════════════════
// STORAGE (localStorage pour PWA)
// ════════════════════════════════
const DB = {
  get(k)    { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
};

const AVATARS = ['🎬','🎮','👾','🦊','🐉','🌙','⚡','🔥','💎','🎭','🌊','🍊','🦁','🐺','🦅','🐸'];

const THEMES = {
  amber:   { name:'Ambre',    a:'#f59e0b', a2:'#fbbf24', b:'#f43f5e' },
  cyan:    { name:'Cyan',     a:'#00d4ff', a2:'#38bdf8', b:'#8b5cf6' },
  violet:  { name:'Violet',   a:'#7c3aed', a2:'#a78bfa', b:'#ec4899' },
  rose:    { name:'Rose',     a:'#f43f5e', a2:'#fb7185', b:'#f97316' },
  emerald: { name:'Émeraude', a:'#10b981', a2:'#34d399', b:'#3b82f6' },
};

const SITES = [
  { id:'coflix',      name:'Coflix',      icon:'🎬', url:'https://coflix.observer',     desc:'Films & Séries VF', tag:'VF/VOSTFR', c:'#f59e0b' },
  { id:'animeo',      name:'Animeo',      icon:'⛩️', url:'https://animeovf.fr/',        desc:'Animés streaming',  tag:'ANIME',     c:'#fb923c' },
  { id:'flemmix',     name:'Flemmix',     icon:'🇫🇷', url:'https://flemmix.me/',         desc:'Films & Séries FR', tag:'VF',        c:'#3b82f6' },
  { id:'crunchyroll', name:'Crunchyroll', icon:'🍊', url:'https://www.crunchyroll.com', desc:'Anime officiel',    tag:'OFFICIEL',  c:'#f97316' },
];

// ════════════════════════════════
// PROFILS
// ════════════════════════════════
function getProfiles() { return DB.get('profiles') || { list: [], activeId: null }; }
function saveProfiles(d) { DB.set('profiles', d); }

function createProfile(name, avatar) {
  const d = getProfiles();
  const p = { id: Date.now().toString(), name, avatar, createdAt: new Date().toISOString(), lastSeen: new Date().toISOString() };
  d.list.push(p);
  if (!d.activeId) d.activeId = p.id;
  saveProfiles(d); return p;
}

function setActive(id) {
  const d = getProfiles();
  const p = d.list.find(p => p.id === id);
  if (!p) return;
  d.activeId = id;
  p.lastSeen = new Date().toISOString();
  saveProfiles(d); return p;
}

function removeProfile(id) {
  const d = getProfiles();
  d.list = d.list.filter(p => p.id !== id);
  if (d.activeId === id) d.activeId = d.list[0]?.id || null;
  saveProfiles(d);
}

function getActive() {
  const d = getProfiles();
  return d.list.find(p => p.id === d.activeId) || null;
}

// ════════════════════════════════
// THÈMES
// ════════════════════════════════
function getTheme() { return DB.get('theme') || 'amber'; }
function setTheme(key) {
  DB.set('theme', key);
  applyTheme(key);
}
function applyTheme(key) {
  const t = THEMES[key] || THEMES.amber;
  const r = document.documentElement.style;
  r.setProperty('--a',  t.a);
  r.setProperty('--a2', t.a2);
  r.setProperty('--b',  t.b);
  document.querySelector('meta[name=theme-color]').content = t.a;
}

// ════════════════════════════════
// ÉCRANS PROFILS
// ════════════════════════════════
let manageMode = false;
let selAvatar = AVATARS[0];

function renderProfilesScreen() {
  const d = getProfiles();
  const grid = document.getElementById('profiles-grid');
  grid.innerHTML = '';

  d.list.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'profile-card';
    card.style.animationDelay = `${i * 0.07}s`;
    card.innerHTML = `<div class="pc-av">${p.avatar}</div><div class="pc-name">${p.name}</div>`;

    if (manageMode) {
      const del = document.createElement('button');
      del.className = 'del-btn'; del.textContent = '✕';
      del.addEventListener('click', e => {
        e.stopPropagation();
        removeProfile(p.id);
        renderProfilesScreen();
      });
      card.querySelector('.pc-av').appendChild(del);
    } else {
      card.addEventListener('click', () => selectProfile(p));
    }
    grid.appendChild(card);
  });

  // Carte +
  const add = document.createElement('div');
  add.className = 'profile-card add-card';
  add.innerHTML = `<div class="pc-av">＋</div><div class="pc-name">Nouveau</div>`;
  add.addEventListener('click', showCreateScreen);
  grid.appendChild(add);
}

function selectProfile(p) {
  setActive(p.id);
  document.getElementById('load-av').textContent  = p.avatar;
  document.getElementById('load-name').textContent = `Bonjour, ${p.name} 👋`;
  document.getElementById('screen-loading').classList.add('visible');
  setTimeout(() => { document.getElementById('load-fill').style.width = '100%'; }, 80);
  setTimeout(() => launchApp(p), 1100);
}

function showCreateScreen() {
  manageMode = false;
  buildAvatarGrid('av-grid', 'selAvatar');
  document.getElementById('new-name').value = '';
  document.getElementById('screen-create').classList.add('visible');
}

document.getElementById('btn-back').addEventListener('click', () => {
  document.getElementById('screen-create').classList.remove('visible');
});

document.getElementById('btn-confirm').addEventListener('click', () => {
  const name = document.getElementById('new-name').value.trim();
  if (!name) { document.getElementById('new-name').focus(); return; }
  createProfile(name, selAvatar);
  document.getElementById('screen-create').classList.remove('visible');
  renderProfilesScreen();
});
document.getElementById('new-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-confirm').click();
});

document.getElementById('btn-manage').addEventListener('click', () => {
  manageMode = !manageMode;
  document.getElementById('btn-manage').textContent = manageMode ? '✓ Terminer' : 'Gérer les profils';
  renderProfilesScreen();
});

function buildAvatarGrid(gridId, varName) {
  const g = document.getElementById(gridId);
  g.innerHTML = '';
  AVATARS.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'av-opt' + (a === selAvatar ? ' sel' : '');
    btn.textContent = a;
    btn.addEventListener('click', () => {
      selAvatar = a;
      g.querySelectorAll('.av-opt').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
    });
    g.appendChild(btn);
  });
}

// ════════════════════════════════
// LANCER L'APP
// ════════════════════════════════
function launchApp(profile) {
  // Cacher écran profil
  document.getElementById('screen-profiles').classList.add('hidden');
  document.getElementById('screen-loading').classList.remove('visible');

  // Mettre à jour l'UI avec le profil
  document.getElementById('btn-profile-top').textContent = profile.avatar;
  document.getElementById('nav-profile-icon').textContent = profile.avatar;

  const h = new Date().getHours();
  const g = h<5?'Bonne nuit':h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir';
  document.getElementById('greeting').textContent = `${g}, ${profile.name} 👋`;

  document.getElementById('app').classList.add('visible');
  renderSites();
  buildThemeSheet();
  buildProfileSheet();
}

// ════════════════════════════════
// DASHBOARD
// ════════════════════════════════
function renderSites() {
  const grid = document.getElementById('sites-grid');
  grid.innerHTML = '';
  SITES.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'site-card';
    card.style.setProperty('--card-c', s.c);
    card.style.animationDelay = `${i * 0.07}s`;
    card.innerHTML = `
      <span class="card-tag">${s.tag}</span>
      <div class="card-icon">${s.icon}</div>
      <div class="card-name">${s.name}</div>
      <div class="card-desc">${s.desc}</div>
    `;
    card.addEventListener('click', () => openSite(s));
    grid.appendChild(card);
  });
}

// ════════════════════════════════
// WEBVIEW (iframe)
// ════════════════════════════════
let currentSite = null;

function openSite(site) {
  currentSite = site;
  document.getElementById('dashboard').style.display = 'none';
  const wc = document.getElementById('webview-container');
  wc.classList.add('active');
  document.getElementById('wv-site-name').textContent = site.name;
  document.getElementById('wv-loading').classList.remove('hidden');
  document.getElementById('wv-loading-text').textContent = `Chargement de ${site.name}…`;

  const iframe = document.getElementById('site-iframe');
  iframe.src = '';
  setTimeout(() => {
    iframe.src = site.url;
    iframe.onload = () => document.getElementById('wv-loading').classList.add('hidden');
  }, 50);

  // Nav active
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-sites').classList.add('active');
}

function closeSite() {
  currentSite = null;
  document.getElementById('site-iframe').src = '';
  document.getElementById('webview-container').classList.remove('active');
  document.getElementById('dashboard').style.display = '';
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-home').classList.add('active');
}

document.getElementById('wv-back').addEventListener('click', closeSite);
document.getElementById('wv-reload').addEventListener('click', () => {
  if (currentSite) {
    document.getElementById('wv-loading').classList.remove('hidden');
    const iframe = document.getElementById('site-iframe');
    iframe.src = iframe.src;
  }
});

// Nav bas
document.getElementById('nav-home').addEventListener('click', closeSite);
document.getElementById('nav-sites').addEventListener('click', () => {
  if (!currentSite) document.getElementById('dashboard').scrollIntoView({ behavior:'smooth' });
});
document.getElementById('nav-profile').addEventListener('click', () => openSheet('profile-sheet'));
document.getElementById('btn-theme-top').addEventListener('click', () => openSheet('theme-sheet'));
document.getElementById('btn-profile-top').addEventListener('click', () => openSheet('profile-sheet'));

// ════════════════════════════════
// BOTTOM SHEETS
// ════════════════════════════════
function openSheet(id) {
  document.getElementById(id).classList.add('open');
}
function closeSheet(id) {
  document.getElementById(id).classList.remove('open');
}

document.getElementById('theme-backdrop').addEventListener('click', () => closeSheet('theme-sheet'));
document.getElementById('profile-backdrop').addEventListener('click', () => closeSheet('profile-sheet'));

// ── THÈMES ──
function buildThemeSheet() {
  const current = getTheme();
  const grid = document.getElementById('theme-grid');
  grid.innerHTML = '';
  Object.entries(THEMES).forEach(([key, t]) => {
    const btn = document.createElement('button');
    btn.className = 'theme-opt' + (key === current ? ' active' : '');
    btn.innerHTML = `<div class="theme-swatch" style="background:linear-gradient(135deg,${t.a},${t.b})"></div>${t.name}`;
    btn.addEventListener('click', () => {
      setTheme(key);
      grid.querySelectorAll('.theme-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildThemeSheet();
      setTimeout(() => closeSheet('theme-sheet'), 300);
    });
    grid.appendChild(btn);
  });
}

// ── PROFILS SHEET ──
function buildProfileSheet() {
  const d = getProfiles();
  const list = document.getElementById('profile-items');
  list.innerHTML = '';
  d.list.forEach(p => {
    const row = document.createElement('button');
    row.className = 'profile-row' + (p.id === d.activeId ? ' active-p' : '');
    row.innerHTML = `
      <div class="pr-av">${p.avatar}</div>
      <div class="pr-info">
        <div class="pr-name">${p.name}</div>
        <div class="pr-date">${new Date(p.lastSeen).toLocaleDateString('fr-FR')}</div>
      </div>
      ${p.id === d.activeId ? '<span class="pr-badge">ACTIF</span>' : ''}
      <button class="pr-del">✕</button>
    `;
    row.addEventListener('click', e => {
      if (e.target.closest('.pr-del')) { removeProfile(p.id); buildProfileSheet(); return; }
      const profile = setActive(p.id);
      document.getElementById('btn-profile-top').textContent = profile.avatar;
      document.getElementById('nav-profile-icon').textContent = profile.avatar;
      buildProfileSheet();
      setTimeout(() => closeSheet('profile-sheet'), 200);
    });
    list.appendChild(row);
  });

  // Grille avatar dans la sheet
  buildAvatarGrid('sheet-av-grid', 'selAvatar');
}

document.getElementById('sheet-btn-confirm').addEventListener('click', () => {
  const name = document.getElementById('sheet-new-name').value.trim();
  if (!name) { document.getElementById('sheet-new-name').focus(); return; }
  createProfile(name, selAvatar);
  document.getElementById('sheet-new-name').value = '';
  buildProfileSheet();
});

// ════════════════════════════════
// INIT
// ════════════════════════════════
(function init() {
  // Appliquer le thème sauvegardé
  applyTheme(getTheme());

  // PWA service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // Vérifier si un profil actif existe
  const active = getActive();
  if (active) {
    // Profil déjà dispo → sélection rapide
    renderProfilesScreen();
  } else {
    renderProfilesScreen();
  }
})();
</script>
</body>
</html>
